server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # TLS kenar katmanda (Traefik) sonlanıyor; nginx isteği http olarak görür ve
    # mutlak Location kurunca şemayı http'ye düşürür → gereksiz 301→302 zinciri.
    # Göreli Location şemayı korur.
    absolute_redirect off;
    port_in_redirect off;

    # www ve apex aynı içeriği 200 ile veriyordu: her URL iki ayrı ana bilgisayarda
    # erişilebilir oluyor ve Google bunu "alternatif sayfa" olarak raporluyor.
    # Kanonik apex; www kalıcı olarak apex'e yönlensin.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript image/svg+xml application/manifest+json;

    # NGINX TUZAĞI: add_header yalnızca alt blokta HİÇ add_header yoksa miras alınır.
    # Bir location kendi başlığını eklediği anda sunucu düzeyindeki TÜM add_header'lar
    # düşer. Bu yüzden güvenlik başlıkları her location'da tekrarlanıyor; tek yerde
    # yazmak /, /static/* ve /veri/* yollarında sessizce başlıksız kalmak demekti.
    #
    # http -> https yönlendirmesini kenar katmandaki Traefik yapıyor ve 302 döndürüyor;
    # oraya müdahale edemiyoruz. HSTS ile tarayıcı sonraki ziyaretlerde doğrudan https
    # ister, yani geçici yönlendirme hiç kurulmaz.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # HTML: her zaman tazele, ama yeniden doğrulama ucuz olsun
    location ~* \.html$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Açık veri
    location ~* ^/(veri/[^/]+\.json|llms\.txt|sitemap\.xml)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # CSS ve JS içerik damgalı adla yayımlanıyor (s.<özet>.css) — içerik değişince
    # ad da değişir, bu yüzden bir yıl "immutable" güvenli.
    # NOT: `expires` yönergesi kendi Cache-Control'ünü ekliyor ve add_header ile
    # birlikte İKİ Cache-Control başlığı çıkıyordu; tek başlıkta topladık.
    location ~* \.(?:css|js)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Görsellerin adı sabit: bir mekânın fotoğrafı değişince dosya adı aynı kalıyor.
    # "immutable" verilseydi eski fotoğraf ziyaretçide bir yıl asılı kalırdı.
    location ~* \.(?:svg|ico|woff2?|png|jpg|jpeg|webp|avif)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }
}
